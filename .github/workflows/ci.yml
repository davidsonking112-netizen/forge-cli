name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Chromium for browser smoke tests
        run: sudo apt-get update && sudo apt-get install -y chromium
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Verify packed install
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/forge-prefix"
          npm pack --pack-destination "$RUNNER_TEMP"
          archive="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'forge-cli-workspace-*.tgz' -print -quit)"
          test -n "$archive"
          npm install --prefix "$RUNNER_TEMP/forge-prefix" "$archive"
          "$RUNNER_TEMP/forge-prefix/node_modules/.bin/forge" --version
          "$RUNNER_TEMP/forge-prefix/node_modules/.bin/forge" errors

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test source tree
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -p 'test_*.py'
      - name: Test clean package installation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/forge-venv"
          "$RUNNER_TEMP/forge-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/forge-venv/bin/python" -m pip install ./python --no-deps
          "$RUNNER_TEMP/forge-venv/bin/python" -c 'import forge_agent, forge_agent.worker; print("forge-agent clean install ok")'
      - name: Audit Python environment
        shell: bash
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit --desc
